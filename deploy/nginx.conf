# Student Document Request Tracker — Production Nginx Reverse Proxy
# Reference target: Ubuntu 24.04 LTS / Debian 12 VPS with Let's Encrypt TLS
# Aligns with docs/specification/project-extracted.txt (Section 13):
# - Serves Flutter Web static release bundle at / with SPA fallback
# - Proxies /api/v1/ to FastAPI (Uvicorn) on loopback 127.0.0.1:8000
# - Unknown /api/* paths pass through to FastAPI so they remain API 404 JSON responses
# - Terminates HTTPS with TLS 1.2/1.3 and forwards X-Forwarded-Proto / Origin headers

server {
    listen 80;
    listen [::]:80;
    server_name sdrt.example.edu;

    # ACME challenge path for Certbot / Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sdrt.example.edu;

    ssl_certificate /etc/letsencrypt/live/sdrt.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sdrt.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Flutter Web release static bundle
    root /opt/sdrt/app/build/web;
    index index.html;

    # Match backend 5 MiB upload limit with multipart overhead margin
    client_max_body_size 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Explicitly deny any web access to private uploads, env files, or hidden directories
    location ~ /\. {
        deny all;
        return 404;
    }

    # Route API requests (including unknown /api/* paths) to FastAPI backend
    # Do NOT fall back to index.html for /api/* so unknown API routes stay 404 JSON.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # Cache immutable hashed Flutter assets safely
    location ~* \.(js|css|wasm|ttf|otf|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Flutter Web SPA fallback strictly scoped to non-API frontend routes
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
